# CI — every push and PR runs the same gates the maintainer runs locally
# (nix run .#<gate>), so "green locally" and "green on CI" can never drift.
#
# Gates not expressible here: `erraudit ./... --type-aware`. The erraudit tool
# lives in a private repository, so CI cannot fetch it. It remains a documented
# local gate — see CONTRIBUTING.md.
#
# Recommended branch protection for master: require the five jobs below plus
# linear history. This file provides the check names CI reports.

name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (race)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Run tests with race detector
        run: nix run .#test-race

      # The coverage floor lives in tools/coverage-gate.sh (total 99.5%,
      # per-package 98%, against a measured 99.9% total / 99.3% federation on
      # 2026-10-27 — the gate's own toolchain; a host go1.27.0 reads the same
      # source as 99.5%). It runs
      # the suite itself, so it is a step here rather than a sixth job;
      # branch protection names five checks, and a new job would silently sit
      # outside the required set.
      - name: Coverage floor
        run: nix run .#coverage-gate

      # Race-stress: repeat the race suite to surface order-dependent flakes.
      # Added 2026-10-09 only after a local -count=3 run was flake-free; if it
      # ever trips intermittently, triage the flake — do not delete the step.
      - name: Race stress (3x)
        run: nix run .#test-race -- -count=3

      - name: Short fuzz run
        run: nix run .#fuzz

  static-analysis:
    name: Vet + Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: go vet
        run: nix run .#vet

      - name: golangci-lint
        run: nix run .#lint

  security:
    name: Security (govulncheck + gosec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: govulncheck
        run: nix run .#vulncheck

      - name: gosec
        run: nix run .#security

  flake:
    name: Flake + Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: nix flake check (includes formatting)
        run: nix flake check

  openapi:
    name: OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint OpenAPI spec (redocly)
        run: npx --yes @redocly/cli@latest lint docs/openapi.yaml
