# Weekly long-budget fuzzing. The per-push CI fuzz run is capped at 10s per
# target; this workflow gives each target 5 minutes to find slow-burn
# regressions. Plain-log output by design: a fuzz crash fails the job and the
# failing input lands in testdata/fuzz/, which the artifact upload preserves
# for triage — SARIF would add plumbing without adding signal.
#
# Local dry run of the exact gate: nix run .#fuzz-long -- -fuzztime=10s
name: Fuzz (weekly long)

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-long-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz-long:
    name: Fuzz (5m/target)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - name: Fuzz every registered target, 5 minutes each
        run: nix run .#fuzz-long

      - name: Upload failing fuzz corpus
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus
          path: |
            testdata/fuzz/
            aggregate/testdata/fuzz/
            checks/testdata/fuzz/
            federation/testdata/fuzz/
            internal/merge/testdata/fuzz/
          if-no-files-found: ignore
