openapi: 3.1.0
info:
  title: go-health probe endpoints
  version: 0.5.1
  description: |
    Kubernetes-style health probes exposed by the go-health Probe.
    Field-presence rules are documented per property; they are enforced by
    the golden-file wire-format test, not by OpenAPI keywords.

    The `health/aggregate` sub-package serves the same three paths and the
    same HealthResponse/Check schemas, so these definitions cover it too.
    Its differences are body-level, not shape-level: merged check keys are
    namespaced `source/check` (everything before the first `/` is the source
    name, which `aggregate.New` guarantees is unique and slash-free), the
    per-process scalars `version`, `instance_id`, and `uptime` are absent
    because they cannot survive a merge, `total_latency_ms` is the slowest
    source's batch, and any shutting-down source forces `shutting_down: true`
    with overall `fail`. Aggregate liveness remains dependency-blind and its
    startup latches only once every source has.

    The `health/federation` sub-package likewise serves the same three paths
    over a merged body (it pulls N remote go-health instances over HTTP and
    merges on read): same `source/check` namespacing and merge rules as
    aggregate, plus one synthetic `<name>/reachable` check graded `fail`
    with the fetch/decode error for every unreachable or undecodable remote —
    an unreachable remote is never a silent freeze and never a status
    override. Wire input is untrusted: invalid documents are refused whole.
    See docs/federation-design.md.
  license:
    name: MIT
    identifier: MIT
# Health endpoints are unauthenticated by design: the kubelet and load
# balancers poll them without credentials. Auth (if any) is the host's
# reverse-proxy decision, not the probe's.
security: []
# Routes are mounted wherever the host application chooses; all paths are
# relative to that base.
servers:
  - url: /
paths:
  /healthz:
    get:
      summary: Liveness
      description: Always 200 while the process runs and has not started
        shutting down. Performs zero dependency checks; checks is always
        empty. Used by kubelet to decide container restarts.
      operationId: liveness
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /readyz:
    get:
      summary: Readiness
      description: 200 when the instance can serve traffic (roll-up pass or
        warn), 503 when any critical service fails or the probe is shutting
        down. Served from the background cache when refresh interval is set.
      operationId: readiness
      responses:
        "200":
          description: Ready (pass) or degraded (warn, non-critical failure).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "503":
          description: A critical service failed or the probe is shutting down.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /startupz:
    get:
      summary: Startup
      description: 503 until every critical service has passed one evaluation,
        then latches to 200 permanently (per process) without re-checking.
      operationId: startup
      responses:
        "200":
          description: Startup complete (latched).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "503":
          description: Boot still in progress (latch unset).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /healthz-combined:
    get:
      summary: Combined traffic gate (mountable Healthz)
      description: |
        One endpoint answering "should traffic be routed here?" — the
        mountable handler returned by health.Probe.Healthz() and
        aggregate.Aggregate.Healthz(). The path shown is documentation-only:
        the host mounts it wherever the load balancer expects (DefaultRoutes
        already claims /healthz for liveness).

        503 while the startup latch is unset (the body then carries one
        synthetic failing "startup" check), when the readiness roll-up is
        fail, or while shutting down; 200 with the full response body
        otherwise (warn stays 200). Reads the same cached/live readiness
        path as /readyz. The aggregate variant fails when any source fails,
        any source is draining, or not every source has latched.
      operationId: healthzCombined
      responses:
        "200":
          description: Traffic should flow (roll-up pass or warn).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "503":
          description: Booting (startup latch unset), a critical failure, or
            shutting down. The synthetic "startup" check appears only on the
            unlatched-boot variant of this 503.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /version:
    get:
      summary: Build version
      description: Reports the binary's build version via health.VersionHandler,
        wired manually by the host next to the probe routes (root package
        only — not part of RegisterRoutes/DefaultRoutes). Identity, not
        health — never evaluates checks, always 200, unaffected by shutdown.
      operationId: version
      responses:
        "200":
          description: The build version; empty string when the binary was
            not stamped.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionResponse" }
        "405":
          description: Non-GET request. The version endpoint enforces GET
            unconditionally — no method-set option involved.
          headers:
            Allow:
              description: Always "GET".
              schema: { type: string }
components:
  responses:
    MethodNotAllowed:
      description: Non-GET request when method enforcement is enabled
        (WithGETOnly / WithAllowedMethods). The Allow header lists the
        accepted methods, sorted, GET always first.
      headers:
        Allow:
          description: Comma-separated accepted methods, e.g. "GET, HEAD".
          schema: { type: string }
  schemas:
    HealthResponse:
      type: object
      required: [status, shutting_down, total_latency_ms, checks]
      properties:
        status:
          type: string
          enum: [pass, warn, fail]
          description: Roll-up. fail = critical failure or shutdown;
            warn = only non-critical failures; pass = all healthy.
        version:
          type: string
          description: Application version when configured via WithVersion;
            omitted otherwise.
        instance_id:
          type: string
          description: Replica identifier when configured via WithInstanceID;
            omitted otherwise.
        uptime:
          type: string
          description: Human-readable time since boot (Go duration string,
            second resolution); omitted when zero.
        shutting_down:
          type: boolean
          description: Always present. True once Shutdown has been called;
            readiness stays 503 from then on, liveness stays 200.
        total_latency_ms:
          type: integer
          format: int64
          description: Always present. Wall-clock milliseconds of the last
            health-check batch; 0 for liveness.
        timestamp:
          type: string
          format: date-time
          description: RFC 3339 completion time of the evaluation. Absent
            until the first evaluation (omitzero).
        checks:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Check"
          description: Always present (possibly empty). Keyed by service name.
    Check:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pass, warn, fail, off]
          description: off marks a deliberately unconfigured dependency
            (OffError) — visibility, never a verdict; the roll-up never
            reports it.
        error:
          type: string
          description: Failure message when the check did not pass; for an
            off check, the configuration detail (usually the enable recipe).
            Omitted otherwise.
        since:
          type: string
          format: date-time
          description: RFC 3339 time the probe first observed this check in
            its current status; carried forward unchanged while the status
            holds, restarted on every status change. Absent (omitzero) for
            checks the probe never built (liveness's empty set, the Healthz
            synthetic startup entry). Resets on process restart.
        duration_ns:
          type: integer
          format: int64
          description: Nanoseconds the most recent execution of this check
            took, as reported by its executor. Absent (omitzero) when
            unknown — the raw samber/do injector path cannot measure
            per-check duration, so only detailed sources
            (NewWithDetailedCheck, DetailedHealthRecorder) populate it.
    VersionResponse:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: The binary's build version as passed to
            health.VersionHandler; empty string when unstamped. Same field
            name and semantics as HealthResponse.version, but always
            present here (no omitempty) — the endpoint's sole purpose is
            this value, so an unstamped binary answers {"version":""}
            rather than an absent field.
